<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix – DJ Carlos</title>
<meta name="description" content="Ascolta i mix di DJ Carlos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0D;
    --violet: #8B5CF6;
    --pink: #EC4899;
    --text: #F5F3FF;
    --muted: #A8A3B8;
    --card: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.5; overflow-x: hidden; min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }

  /* Animated background */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .5; will-change: transform; }
  .blob.b1 { width: 55vmax; height: 55vmax; background: var(--violet); top: -20vmax; left: -15vmax; animation: drift1 18s ease-in-out infinite alternate; }
  .blob.b2 { width: 50vmax; height: 50vmax; background: var(--pink); bottom: -22vmax; right: -15vmax; animation: drift2 22s ease-in-out infinite alternate; }
  .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(13,13,13,.4) 0%, rgba(13,13,13,.88) 100%); }
  @keyframes drift1 { to { transform: translate(35vmax, 25vmax) scale(1.2); } }
  @keyframes drift2 { to { transform: translate(-35vmax, -25vmax) scale(1.15); } }

  /* Navigation */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px clamp(16px, 5vw, 48px); background: rgba(13,13,13,.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: .08em; color: var(--text); text-decoration: none; font-size: 1.05rem; }
  .logo span { color: var(--pink); }
  nav ul { display: flex; gap: clamp(14px, 3vw, 36px); list-style: none; }
  nav a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: .95rem; padding: 6px 2px; position: relative; transition: color .2s; }
  nav a::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: linear-gradient(90deg, var(--violet), var(--pink)); transition: width .25s; }
  nav a:hover, nav a[aria-current="page"] { color: var(--text); }
  nav a:hover::after, nav a[aria-current="page"]::after { width: 100%; }

  main { max-width: 1100px; margin: 0 auto; padding: 110px clamp(16px, 5vw, 48px) 60px; }
  h1 { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.6rem); letter-spacing: .06em; text-transform: uppercase; }
  h1 span { color: var(--pink); text-shadow: 0 0 16px var(--pink); }
  .sub { color: var(--muted); margin: 6px 0 32px; }

  /* Player layout */
  .app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 28px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 30px 80px -30px rgba(139,92,246,.45); }
  .player { padding: clamp(20px, 4vw, 36px); }

  /* Cover art */
  .cover { position: relative; aspect-ratio: 1; width: min(100%, 340px); margin: 0 auto 28px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(from 0deg, var(--violet), var(--pink), var(--violet), var(--pink), var(--violet));
    box-shadow: 0 0 40px rgba(236,72,153,.5), 0 0 90px rgba(139,92,246,.4);
    animation: spin 8s linear infinite paused; }
  .cover.playing { animation-play-state: running; }
  .cover::before { content: ""; position: absolute; inset: 7%; border-radius: 50%;
    background: repeating-radial-gradient(circle, #111 0 3px, #1a1a1f 3px 5px); }
  .cover::after { content: ""; position: absolute; width: 30%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #0D0D0D 0 14%, transparent 15%), linear-gradient(135deg, var(--violet), var(--pink)); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta { text-align: center; margin-bottom: 22px; }
  .now { font-size: .72rem; letter-spacing: .25em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .title { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: clamp(1.15rem, 3.5vw, 1.55rem); margin: 6px 0 2px; text-shadow: 0 0 18px rgba(139,92,246,.7); overflow-wrap: anywhere; }
  .artist { color: var(--muted); font-size: .95rem; }
  .duration-line { color: var(--muted); font-size: .8rem; margin-top: 4px; }

  .viz { display: block; width: 100%; height: 64px; margin-bottom: 4px; }

  /* Range inputs */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; --fill: 0%; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--violet), var(--pink)) 0 / var(--fill) 100% no-repeat, rgba(255,255,255,.14); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: rgba(255,255,255,.14); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--violet), var(--pink)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 4px rgba(236,72,153,.35), 0 0 14px var(--pink); transition: transform .15s; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 4px rgba(236,72,153,.35), 0 0 14px var(--pink); }
  input[type=range]:hover::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { transform: scale(1.25); }
  .seekrow { display: flex; align-items: center; gap: 12px; }
  .seekrow input[type=range] { flex: 1; min-width: 0; }
  .time { flex: none; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace; font-size: .85rem; color: var(--muted); white-space: nowrap; }
  .time #cur { color: var(--text); }

  /* Controls */
  .controls { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 5vw, 32px); margin: 18px 0 22px; }
  .ctl { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--text); transition: transform .15s, color .15s, background .15s; }
  .ctl:hover { color: var(--pink); background: rgba(255,255,255,.07); transform: scale(1.08); }
  .ctl svg { width: 26px; height: 26px; fill: currentColor; }
  .play { width: 72px; height: 72px; color: #fff; background: linear-gradient(135deg, var(--violet), var(--pink)); box-shadow: 0 0 24px rgba(236,72,153,.65), 0 0 56px rgba(139,92,246,.5); }
  .play:hover { color: #fff; background: linear-gradient(135deg, var(--violet), var(--pink)); transform: scale(1.08); box-shadow: 0 0 34px rgba(236,72,153,.9), 0 0 70px rgba(139,92,246,.7); }
  .play svg { width: 32px; height: 32px; }
  .play .i-pause { display: none; }
  .play.on .i-pause { display: block; }
  .play.on .i-play { display: none; }

  .volume { display: flex; align-items: center; gap: 10px; max-width: 260px; margin: 0 auto; }
  .volume .ctl { width: 36px; height: 36px; flex: none; }
  .volume .ctl svg { width: 20px; height: 20px; }

  /* Playlist */
  .list { padding: 12px; }
  .list h2 { font-family: 'Orbitron', sans-serif; font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding: 12px 14px 8px; }
  .track { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 16px; border: 1px solid transparent; transition: background .2s, border-color .2s; }
  .track:hover { background: rgba(255,255,255,.06); }
  .track.active { background: linear-gradient(90deg, rgba(139,92,246,.2), rgba(236,72,153,.16)); border-color: rgba(236,72,153,.5); box-shadow: 0 0 24px -6px rgba(236,72,153,.5); }
  .num { font-family: 'Orbitron', sans-serif; font-size: .85rem; color: var(--muted); text-align: center; }
  .track.active .num { display: none; }
  .eq { display: none; align-items: flex-end; justify-content: center; gap: 2px; height: 16px; }
  .track.active .eq { display: flex; }
  .eq i { width: 3px; background: linear-gradient(to top, var(--violet), var(--pink)); border-radius: 2px; height: 30%; }
  .track.active.playing .eq i { animation: eq 1s ease-in-out infinite alternate; }
  .track.active.playing .eq i:nth-child(2) { animation-duration: .7s; }
  .track.active.playing .eq i:nth-child(3) { animation-duration: 1.3s; }
  @keyframes eq { from { height: 15%; } to { height: 100%; } }
  .t-title { font-weight: 600; font-size: .98rem; }
  .t-sub { color: var(--muted); font-size: .82rem; }
  .track.active .t-title { color: #fff; }
  .t-dur { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

  /* Invito "Tocca per riprodurre" (solo dispositivi touch, al primo caricamento) */
  .tap { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 24px;
    background: rgba(13,13,13,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .tap.show { display: grid; animation: pop .35s ease; }
  .tap button { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 34px 40px; border-radius: 32px;
    border: 1px solid rgba(236,72,153,.55); background: rgba(255,255,255,.06); color: #fff;
    font-family: 'Orbitron', sans-serif; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 1.05rem;
    text-shadow: 0 0 14px rgba(236,72,153,.8);
    box-shadow: 0 0 32px rgba(236,72,153,.5), 0 0 80px rgba(139,92,246,.45); }
  .tap .tap-icon { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--violet), var(--pink)); box-shadow: 0 0 28px rgba(236,72,153,.8), 0 0 64px rgba(139,92,246,.6);
    animation: pulse 1.8s ease-in-out infinite; }
  .tap .tap-icon svg { width: 38px; height: 38px; fill: #fff; margin-left: 4px; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  /* Mini player sticky (compare quando il lettore completo esce dallo schermo) */
  .mini { position: fixed; left: 50%; bottom: 14px; z-index: 20; width: min(640px, calc(100% - 24px));
    display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "play info" "play bar"; column-gap: 14px; align-items: center;
    padding: 10px 18px 8px 10px; border-radius: 22px; cursor: pointer;
    background: rgba(13,13,13,.78); border: 1px solid rgba(236,72,153,.45);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 28px -4px rgba(236,72,153,.45), 0 0 60px -10px rgba(139,92,246,.6);
    transform: translate(-50%, 140%); opacity: 0; visibility: hidden;
    transition: transform .35s ease, opacity .35s ease, visibility 0s .35s; }
  .mini.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition-delay: 0s; }
  .mini .play { grid-area: play; width: 48px; height: 48px; }
  .mini .play svg { width: 22px; height: 22px; }
  .mini-info { grid-area: info; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .mini-title { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-hint { margin-left: auto; flex: none; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .mini input[type=range] { grid-area: bar; height: 16px; }
  body.has-mini main { padding-bottom: 120px; }
  body.has-mini .site-footer { padding-bottom: 110px; }   /* il mini lettore non copre il piè di pagina */

  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { .mini-hint { display: none; } }
  @media (max-width: 480px) { .logo { font-size: .9rem; } nav a { font-size: .85rem; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>
  <div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div></div>

  <header>
    <a href="index.html#home" class="logo">DJ<span>.</span>CARLOS</a>
    <nav aria-label="Navigazione principale">
      <ul>
        <li><a href="index.html#home">Home</a></li>
        <li><a href="mixes.html" aria-current="page">Mix</a></li>
        <li><a href="booking.html">Prenota</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>I miei <span>mix</span></h1>
    <p class="sub">Premi play e lasciati portare dal beat.</p>

    <div class="app">
      <section class="panel player" aria-label="Lettore audio">
        <div class="cover" id="cover" aria-hidden="true"></div>

        <div class="meta">
          <div class="now">In riproduzione</div>
          <div class="title" id="title">—</div>
          <div class="artist">DJ Carlos</div>
          <div class="duration-line">Durata <span id="totalInfo">--:--</span></div>
        </div>

        <canvas id="viz" class="viz" aria-hidden="true"></canvas>
        <div class="seekrow">
          <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Avanzamento brano">
          <div class="time"><span id="cur">0:00</span> / <span id="dur">--:--</span></div>
        </div>

        <div class="controls">
          <button class="ctl" id="prev" aria-label="Brano precedente"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
          <button class="ctl play" id="play" aria-label="Riproduci">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button class="ctl" id="next" aria-label="Brano successivo"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>

        <div class="volume">
          <button class="ctl" id="mute" aria-label="Disattiva audio"><svg viewBox="0 0 24 24"><path id="volIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>

      </section>

      <section class="panel list" aria-label="Playlist">
        <h2>Playlist · 5 brani</h2>
        <div id="playlist"></div>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <ul class="social" aria-label="Social media">

      <li><a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" aria-label="Spotify"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M6.5 9.5c3.5-1 7.5-.7 11 1.2M7 12.8c3-.8 6-.5 9 1M7.5 15.8c2.4-.6 4.6-.4 6.8.7"/></svg></a></li>
      <li><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg></a></li>
      <li><a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg></a></li>
    </ul>
    <a class="mail" href="mailto:carlos@example.com">carlos@example.com</a>
    <p class="copy">© 2026 DJ Carlos · Mexico City · Tutti i diritti riservati</p>

  <div class="tap" id="tap">
    <button type="button" id="tapBtn" aria-label="Tocca per riprodurre">
      <span class="tap-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
      Tocca per riprodurre
    </button>
  </div>

  <div class="mini" id="mini" role="region" aria-label="Mini lettore">
    <button class="ctl play" id="miniPlay" aria-label="Riproduci">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="mini-info">
      <span class="mini-title" id="miniTitle">—</span>
      <span class="mini-hint">Tocca per espandere</span>
    </div>
    <input type="range" id="miniSeek" min="0" max="100" step="0.1" value="0" aria-label="Avanzamento brano">
  </div>

<script>
  // Segnaposto: sostituisci con gli URL MP3 definitivi (es. scaricati da pixabay.com/music).
  const TRACKS = [
    { title: 'Neon Nights',      sub: 'House',         src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
    { title: 'Chilango Bass',    sub: 'Latin Bass',    src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
    { title: 'Sunset en Tulum',  sub: 'Melodic Techno', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
    { title: 'Roma Norte After', sub: 'Deep House',    src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
    { title: 'Beyond the Zócalo', sub: 'Electro',      src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' }
  ];

  const $ = id => document.getElementById(id);
  // Due elementi audio alternati per la dissolvenza incrociata; `audio` è quello attivo.
  // crossOrigin serve per leggere le frequenze con Web Audio; se la sorgente non invia header CORS si passa al ripiego (vedi 'error')
  const slots = [0, 1].map(() => {
    const el = new Audio();
    el.preload = 'metadata';
    el.crossOrigin = 'anonymous';
    return { el, fade: 1, gain: null };
  });
  let audio = slots[0].el;
  // Ascolta un evento solo dall'elemento attivo (quello in dissolvenza in uscita viene ignorato)
  const onAudio = (type, fn) => slots.forEach(s => s.el.addEventListener(type, e => { if (s.el === audio) fn(e); }));
  const FADE_MS = 500;
  let masterVol = 0.8;
  let index = 0;
  let seeking = false;

  const fmt = s => {
    if (!isFinite(s)) return '--:--';
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const setFill = (el) => {
    const pct = (el.value - el.min) / (el.max - el.min) * 100;
    el.style.setProperty('--fill', pct + '%');
  };

  // Build playlist
  const list = $('playlist');
  TRACKS.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'track';
    b.innerHTML =
      '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>' +
      '<span><div class="t-title"></div><div class="t-sub"></div></span>' +
      '<span class="t-dur">--:--</span>';
    b.querySelector('.t-title').textContent = t.title;
    b.querySelector('.t-sub').textContent = t.sub;
    b.addEventListener('click', () => (i === index ? toggle() : go(i, true)));
    list.appendChild(b);

    // Durata di ogni brano nella playlist
    const probe = new Audio();
    probe.preload = 'metadata';
    probe.addEventListener('loadedmetadata', () => { b.querySelector('.t-dur').textContent = fmt(probe.duration); });
    probe.src = t.src;
  });
  const rows = [...list.children];

  // Livelli: in modalità Web Audio la dissolvenza passa dal GainNode, altrimenti dal volume dell'elemento
  function applyLevels() {
    slots.forEach(s => {
      if (s.gain) { s.el.volume = masterVol; s.gain.gain.value = s.fade; }
      else s.el.volume = masterVol * s.fade;
    });
  }

  let fadeRaf = 0, fadeOut = null;
  function finishFade() {
    cancelAnimationFrame(fadeRaf); fadeRaf = 0;
    if (fadeOut) { fadeOut.el.pause(); fadeOut = null; }
  }
  function runFade(outS, inS) {
    const t0 = performance.now(), o0 = outS.fade, i0 = inS.fade;
    fadeOut = outS;
    (function step(t) {
      const p = Math.min(1, (t - t0) / FADE_MS);
      outS.fade = o0 * (1 - p);
      inS.fade = i0 + (1 - i0) * p;
      applyLevels();
      if (p < 1) fadeRaf = requestAnimationFrame(step); else finishFade();
    })(t0);
  }

  // Cambio brano: dissolvenza incrociata se sta suonando, altrimenti caricamento semplice
  function go(i, autoplay) {
    if (audio.paused) return load(i, autoplay);
    finishFade();
    const outS = slots.find(s => s.el === audio);
    const inS = slots.find(s => s !== outS);
    inS.fade = 0;
    audio = inS.el;
    applyLevels();
    load(i, true);
    runFade(outS, inS);
  }

  function load(i, autoplay) {
    index = (i + TRACKS.length) % TRACKS.length;
    audio.src = TRACKS[index].src;
    $('title').textContent = $('miniTitle').textContent = TRACKS[index].title;
    $('miniSeek').value = 0; setFill($('miniSeek'));
    $('dur').textContent = $('totalInfo').textContent = '--:--';
    $('cur').textContent = '0:00';
    $('seek').value = 0; setFill($('seek'));
    rows.forEach((r, k) => r.classList.toggle('active', k === index));
    if (autoplay) audio.play().catch(() => {});
  }
  function toggle() {
    if (audio.paused) {
      if (sharedCtx && sharedCtx.state !== 'running') sharedCtx.resume().catch(() => {});
      audio.play().catch(() => {});
    } else {
      finishFade();
      slots.find(s => s.el === audio).fade = 1;   // se in pausa a metà dissolvenza, riprende a volume pieno
      applyLevels();
      audio.pause();
    }
  }

  function syncPlaying() {
    const on = !audio.paused;
    for (const id of ['play', 'miniPlay']) {
      $(id).classList.toggle('on', on);
      $(id).setAttribute('aria-label', on ? 'Pausa' : 'Riproduci');
    }
    if (on) started = true;
    updateMini();
    $('cover').classList.toggle('playing', on);
    rows.forEach((r, k) => r.classList.toggle('playing', on && k === index));
  }

  onAudio('play', syncPlaying);
  onAudio('pause', syncPlaying);
  onAudio('loadedmetadata', () => {
    $('dur').textContent = $('totalInfo').textContent = fmt(audio.duration);
  });
  onAudio('timeupdate', () => {
    if (seeking || !audio.duration) return;
    $('seek').value = $('miniSeek').value = audio.currentTime / audio.duration * 100;
    setFill($('seek')); setFill($('miniSeek'));
    $('cur').textContent = fmt(audio.currentTime);
  });
  onAudio('ended', () => load(index + 1, true));
  onAudio('error', () => {
    // Sorgente senza CORS: riprova senza crossOrigin. L'audio funziona, ma le frequenze reali
    // non sono leggibili, quindi il visualizzatore passa a un'animazione simulata.
    if (audio.crossOrigin && !vizGraph) {
      const wasPlaying = vizWantsPlay;
      slots.forEach(s => s.el.removeAttribute('crossorigin'));
      vizReal = false;
      audio.src = TRACKS[index].src;
      if (wasPlaying) audio.play().catch(() => {});
      return;
    }
    $('dur').textContent = $('totalInfo').textContent = '--:--';
  });

  // Seek
  const seek = $('seek');
  seek.addEventListener('input', () => {
    seeking = true;
    setFill(seek);
    if (audio.duration) $('cur').textContent = fmt(seek.value / 100 * audio.duration);
  });
  seek.addEventListener('change', () => {
    if (audio.duration) audio.currentTime = seek.value / 100 * audio.duration;
    seeking = false;
  });

  // Visualizzatore: barre verticali dalle frequenze (Web Audio AnalyserNode)
  const canvas = $('viz');
  const ctx2d = canvas.getContext('2d');
  const BARS = 32;
  const levels = new Array(BARS).fill(0);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let vizGraph = null;      // { actx, analyser, data } creato al primo play
  let vizReal = true;       // false = sorgente senza CORS, animazione simulata
  let vizWantsPlay = false;
  let rafId = 0;

  let sharedCtx = null;     // AudioContext creato/sbloccato dentro il primo tocco
  let corsOk = false;       // confermato dalla verifica iniziale (vedi sotto)

  function initGraph() {
    if (vizGraph || !vizReal || !corsOk) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { vizReal = false; return; }
    const actx = sharedCtx || (sharedCtx = new AC());
    const analyser = actx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.75;
    analyser.connect(actx.destination);
    // Entrambi gli elementi passano da un GainNode, così la dissolvenza incrociata è già pronta
    slots.forEach(s => {
      s.gain = actx.createGain();
      s.gain.gain.value = s.fade;
      actx.createMediaElementSource(s.el).connect(s.gain);
      s.gain.connect(analyser);
    });
    vizGraph = { actx, analyser, data: new Uint8Array(analyser.frequencyBinCount) };
    applyLevels();
  }

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBars();
  }

  function sample(t) {
    if (vizGraph) {
      const { analyser, data } = vizGraph;
      analyser.getByteFrequencyData(data);
      return i => data[1 + Math.floor(Math.pow(i / BARS, 1.6) * (data.length - 4))] / 255;
    }
    // Simulata: onde sovrapposte, più energia sui bassi
    return i => (0.5 + 0.5 * Math.sin(t / 260 + i * 0.9) * Math.sin(t / 410 + i * 0.37)) * (1 - i / (BARS * 1.4));
  }

  function drawBars() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx2d.clearRect(0, 0, w, h);
    const g = ctx2d.createLinearGradient(0, h, 0, 0);
    g.addColorStop(0, '#8B5CF6');
    g.addColorStop(1, '#EC4899');
    ctx2d.fillStyle = g;
    ctx2d.shadowColor = 'rgba(236,72,153,.55)';
    ctx2d.shadowBlur = 8;
    const gap = 3, bw = (w - gap * (BARS - 1)) / BARS;
    for (let i = 0; i < BARS; i++) {
      const bh = Math.max(3, levels[i] * h);
      const x = i * (bw + gap), y = h - bh;
      ctx2d.beginPath();
      ctx2d.roundRect ? ctx2d.roundRect(x, y, bw, bh, Math.min(bw / 2, 3)) : ctx2d.rect(x, y, bw, bh);
      ctx2d.fill();
    }
  }

  function frame(t) {
    const playing = !audio.paused;
    const read = playing ? sample(t) : null;
    let alive = playing;
    for (let i = 0; i < BARS; i++) {
      const v = read ? read(i) : 0;
      levels[i] = Math.max(v, levels[i] * 0.9);   // risalita immediata, discesa morbida
      if (levels[i] > 0.01) alive = true;
    }
    drawBars();
    rafId = alive ? requestAnimationFrame(frame) : 0;
  }
  function startViz() {
    if (reduceMotion || rafId) return;
    rafId = requestAnimationFrame(frame);
  }

  onAudio('play', () => {
    vizWantsPlay = true;
    try { initGraph(); } catch { vizReal = false; }
    if (vizGraph && vizGraph.actx.state === 'suspended') vizGraph.actx.resume();
    startViz();
  });
  onAudio('pause', () => { vizWantsPlay = false; });
  new ResizeObserver(sizeCanvas).observe(canvas);

  // Verifica CORS in anticipo: il grafo Web Audio si crea solo se la sorgente lo permette,
  // altrimenti su mobile (dove i metadati non vengono precaricati) l'errore arriverebbe dopo il play e l'audio resterebbe muto.
  fetch(TRACKS[0].src, { method: 'HEAD', mode: 'cors' })
    .then(r => r.ok)
    .catch(() => false)
    .then(ok => {
      if (ok) {
        corsOk = true;
        if (!audio.paused) { try { initGraph(); } catch { vizReal = false; } }
        return;
      }
      vizReal = false;
      slots.forEach(s => s.el.removeAttribute('crossorigin'));
      if (audio.getAttribute('src')) {            // ricarica l'elemento attivo senza richiesta CORS
        const playing = !audio.paused;
        audio.src = TRACKS[index].src;
        if (playing) audio.play().catch(() => {});
      }
    });

  // Sblocco audio mobile: i browser permettono play() solo dopo un gesto dell'utente, e su iOS
  // ogni elemento audio va "sbloccato" separatamente. Al primo tocco/clic (fase di cattura, quindi
  // prima di qualsiasi altro gestore) si riattiva l'AudioContext e si sblocca l'elemento di riserva
  // usato per la dissolvenza incrociata.
  const SILENCE = (() => {
    const n = 800, b = new Uint8Array(44 + n).fill(128), v = new DataView(b.buffer);
    const tag = (o, s) => [...s].forEach((c, k) => b[o + k] = c.charCodeAt(0));
    tag(0, 'RIFF'); v.setUint32(4, 36 + n, true); tag(8, 'WAVEfmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true); tag(36, 'data'); v.setUint32(40, n, true);
    return 'data:audio/wav;base64,' + btoa(String.fromCharCode(...b));
  })();
  const GESTURES = ['touchend', 'click', 'keydown'];
  function unlockAudio() {
    GESTURES.forEach(t => document.removeEventListener(t, unlockAudio, true));
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!sharedCtx && AC && vizReal) { try { sharedCtx = new AC(); } catch {} }
    if (sharedCtx) sharedCtx.resume().catch(() => {});
    const idle = slots.find(s => s.el !== audio);
    idle.el.muted = true;
    idle.el.src = SILENCE;
    idle.el.play()
      .then(() => { if (idle.el.getAttribute('src') === SILENCE) idle.el.pause(); })
      .catch(() => {})
      .finally(() => { idle.el.muted = false; });
  }
  GESTURES.forEach(t => document.addEventListener(t, unlockAudio, true));

  // Invito "Tocca per riprodurre" sui dispositivi touch al primo caricamento
  if (matchMedia('(hover: none) and (pointer: coarse)').matches) {
    const tap = $('tap');
    tap.classList.add('show');
    $('tapBtn').focus({ preventScroll: true });
    $('tapBtn').addEventListener('click', () => {
      tap.classList.remove('show');
      audio.play().catch(() => {});
    });
  }

  // Mini seek
  const miniSeek = $('miniSeek');
  miniSeek.addEventListener('input', () => { seeking = true; setFill(miniSeek); });
  miniSeek.addEventListener('change', () => {
    if (audio.duration) audio.currentTime = miniSeek.value / 100 * audio.duration;
    seeking = false;
  });

  // Mini player: compare quando il lettore completo esce dallo schermo (dopo la prima riproduzione)
  const mini = $('mini');
  const playerEl = document.querySelector('.player');
  let started = false, playerVisible = true;
  function updateMini() {
    const show = started && !playerVisible;
    mini.classList.toggle('show', show);
    document.body.classList.toggle('has-mini', show);
    mini.inert = !show;
  }
  new IntersectionObserver(([entry]) => { playerVisible = entry.isIntersecting; updateMini(); }).observe(playerEl);
  updateMini();

  // Clic sul mini lettore (fuori da play e barra) = torna al lettore completo
  mini.addEventListener('click', e => {
    if (e.target.closest('#miniPlay, #miniSeek')) return;
    playerEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // Controls
  $('play').addEventListener('click', toggle);
  $('miniPlay').addEventListener('click', toggle);
  $('prev').addEventListener('click', () => {
    if (audio.currentTime > 3) audio.currentTime = 0; else go(index - 1, !audio.paused);
  });
  $('next').addEventListener('click', () => go(index + 1, !audio.paused));

  // Volume
  const vol = $('vol');
  let lastVol = 0.8;
  const MUTED = 'M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z';
  const LOUD = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z';
  function applyVol() {
    masterVol = +vol.value;
    applyLevels();
    setFill(vol);
    $('volIcon').setAttribute('d', masterVol === 0 ? MUTED : LOUD);
  }
  vol.addEventListener('input', () => { if (+vol.value > 0) lastVol = +vol.value; applyVol(); });
  $('mute').addEventListener('click', () => { vol.value = masterVol === 0 ? lastVol : 0; applyVol(); });

  // Scorciatoie da tastiera
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, button')) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight') $('next').click();
    if (e.code === 'ArrowLeft') $('prev').click();
  });

  applyVol();
  load(0, false);
</script>
</body>
</html>
